# Netlify hosts the Kontaa app (client). The API runs elsewhere (see render.yaml) and Netlify
# passes /api/* through to it, so the browser sees one origin and the sign-in cookie works.
#
# Set KONTAA_API_ORIGIN in Netlify (Site configuration > Environment variables), e.g.
#   https://kontaa-api.onrender.com
[build]
  command = "npm ci && node client/scripts/write-redirects.mjs && npm run build --workspace client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# The service worker, the page and the manifest must always be rechecked, or updates won't reach people.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
